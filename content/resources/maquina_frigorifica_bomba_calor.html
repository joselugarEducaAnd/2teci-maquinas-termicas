="2.9" fill="#073f66"/><circle cx="38" cy="12" r="2.9" fill="#073f66"/></svg><span><b style="color:#0a6aa8">azul claro</b> (punto 4): mezcla líquido-vapor a baja presión, muy fría</span></span><span class="bc-ley-k"><svg class="bc-muestra" viewBox="0 0 46 20" aria-hidden="true"><rect x="0.75" y="0.75" width="44.5" height="18.5" rx="9.25" fill="#2b4fcf" stroke="#1b2f8f" stroke-width="1.5"/><circle cx="9" cy="8" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.5"/><circle cx="23" cy="12" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.5"/><circle cx="37" cy="7" r="2.6" fill="none" stroke="#ffffff" stroke-width="1.5"/></svg><span><b style="color:#1b2f8f">azul oscuro</b> (punto 1): vapor a baja presión</span></span><span class="bc-ley-k">Círculos huecos = burbujas de vapor; círculos llenos = gotas de líquido.</span></span><span class="bc-leyenda"><span class="bc-ley-k"><svg class="bc-muestra-f" viewBox="0 0 36 16" aria-hidden="true"><path d="M1 5h22V1l12 7-12 7v-4H1z" fill="#f3b8ae" stroke="#a3241a" stroke-width="1.3"/></svg><span><b style="color:#a3241a">Q<sub>C</sub></b>: calor que cede el condensador</span></span><span class="bc-ley-k"><svg class="bc-muestra-f" viewBox="0 0 36 16" aria-hidden="true"><path d="M1 5h22V1l12 7-12 7v-4H1z" fill="#b9d3f5" stroke="#1d4f9c" stroke-width="1.3"/></svg><span><b style="color:#1d4f9c">Q<sub>F</sub></b>: calor que absorbe el evaporador</span></span><span class="bc-ley-k"><svg class="bc-muestra-f" viewBox="0 0 36 16" aria-hidden="true"><path d="M1 5h22V1l12 7-12 7v-4H1z" fill="#c6e3b5" stroke="#2f6b1f" stroke-width="1.3"/></svg><span><b style="color:#2f6b1f">W</b>: trabajo del compresor (corriente eléctrica)</span></span><span class="bc-ley-k"><svg class="bc-muestra-f" viewBox="0 0 36 16" aria-hidden="true"><path d="M1 8h22" stroke="#2c73c9" stroke-width="2.4" stroke-dasharray="5 3"/><path d="M22 3l12 5-12 5z" fill="#2c73c9"/></svg><svg class="bc-muestra-f" viewBox="0 0 36 16" aria-hidden="true"><path d="M1 8h22" stroke="#cf4f20" stroke-width="2.4" stroke-dasharray="5 3"/><path d="M22 3l12 5-12 5z" fill="#cf4f20"/></svg><span>aire que mueven los ventiladores: azul más frío, naranja más caliente</span></span></span><span class="iso-caption">Máquina reversible aire-aire (aire acondicionado de tipo split) cortada para ver su interior. El fluido frigorígeno recorre un circuito cerrado: el compresor lo aspira como vapor a baja presión (1) y lo descarga como vapor a alta presión y muy caliente (2); en el condensador cede Q<sub>C</sub> y se condensa (3); en la válvula de expansión baja de presión de golpe y se enfría (4); en el evaporador absorbe Q<sub>F</sub> y se evapora, y vuelve al compresor. En verano la batería interior es el evaporador y la máquina enfría la casa (máquina frigorífica, ε<sub>F</sub> = Q<sub>F</sub> / W); en invierno la válvula inversora mueve su corredera, el fluido recorre las baterías al revés y la batería interior pasa a ser el condensador (bomba de calor, ε<sub>BC</sub> = Q<sub>C</sub> / W). El compresor y el orden 1→2→3→4 no cambian. Siempre se cumple Q<sub>C</sub> = W + Q<sub>F</sub>: el grosor de cada flecha es proporcional a su valor. Números ilustrativos, típicos de una máquina doméstica: energías de cada segundo de funcionamiento en kJ (equivalen a kW) y presiones absolutas redondeadas.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];

function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {

    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    const out = [];
    for (const [cx, cy, start] of corners) {

}
function signedArea(points) {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {

    const lower = [];

        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

function extrude(ring, z, height, projection, options = {}) {

function sideOf(meridian) {

  let last = m - 1;

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const R = right.map((point) => iso(point, P));

      const dy = b[1] - a[1];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    fill: fillPath,

    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),

function shapeOf(meridian, P, smooth) {

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];

}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

  for (let j = 0; j < n; j++) {

    tones.push(bandOf(dot3(normal, L)));

    fills.push(d);

    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);

function prismOf(F, polygon, s0, s1, P) {

    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
  const pad = 0.35 / scaleOf(P);
  const ring = (s) => Array.from({ length: 48 }, (_, index) => iso(pointOf(F, s, r + pad, (index / 48) * TAU), P));
  return {
    paths: disc(from - stroke, to, r, F, P, options),
    clip: pathOf(hullOf([...ring(from), ...ring(to + stroke)]), true),
    from,
    to,
    stroke,
    reach: to + stroke,
  };
}

function dotsOf(F, s, r, count, P, { phase = 0, slope = 0, least = 0.08, all = false, fade = null } = {}) {
  const V = viewOf(P);
  const out = [];
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    let alpha = 1;
    if (!all) {
      const radial = radialOf(F, t);
      const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
      const facing = dot3(normal, V);
      if (fade) alpha = fadeOf(facing, fade);
      else if (facing < least) continue;
      if (alpha <= 0.02) continue;
    }
    const [x, y] = iso(pointOf(F, s, r, t), P);
    out.push(alpha < 1 ? [x, y, alpha] : [x, y]);
  }
  return out;
}

function facingOf(F, angle, P, slope = 0) {
  const radial = radialOf(F, angle);
  return dot3(unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]), viewOf(P));
}

function fillet(points, radius, perArc = 7, { P = null, tube = 0, margin = 1.3 } = {}) {
  if (points.length < 3) return points.map((p) => [...p]);
  const V = P && tube ? viewOf(P) : null;
  const out = [[...points[0]]];
  for (let index = 1; index < points.length - 1; index++) {
    const prev = points[index - 1];
    const here = points[index];
    const next = points[index + 1];
    const into = unit3(sub3(here, prev));
    const outOf = unit3(sub3(next, here));
    const cosTurn = Math.max(-1, Math.min(1, dot3(into, outOf)));
    const turn = Math.acos(cosTurn);
    if (turn < 1e-3) {
      out.push([...here]);
      continue;
    }
    const room = Math.min(len3(sub3(here, prev)), len3(sub3(next, here))) * 0.48;
    const facing = V ? Math.abs(dot3(unit3(cross3(into, outOf)), V)) : 1;
    const bend = V ? Math.max(radius, (margin * tube) / (0.7 * Math.max(0.05, facing) ** 2)) : radius;
    const cut = Math.min(bend * Math.tan(turn / 2), room);
    const a = sub3(here, mul3(into, cut));
    const b = add3(here, mul3(outOf, cut));
    const count = Math.max(2, Math.ceil((perArc * turn) / (Math.PI / 2)));
    for (let step = 0; step <= count; step++) {
      const t = step / count;
      const p0 = lerp3(a, here, t);
      const p1 = lerp3(here, b, t);
      out.push(lerp3(p0, p1, t));
    }
  }
  out.push([...points[points.length - 1]]);
  return out;
}

function resample(points, spacing) {
  const lengths = [0];
  for (let index = 1; index < points.length; index++) lengths.push(lengths[index - 1] + len3(sub3(points[index], points[index - 1])));
  const total = lengths[lengths.length - 1];
  const count = Math.max(1, Math.round(total / spacing));
  const out = [];
  let segment = 1;
  for (let step = 0; step <= count; step++) {
    const at = (total * step) / count;
    while (segment < points.length - 1 && lengths[segment] < at) segment++;
    const a = points[segment - 1];
    const b = points[segment];
    const span = lengths[segment] - lengths[segment - 1] || 1;
    out.push(lerp3(a, b, Math.min(1, Math.max(0, (at - lengths[segment - 1]) / span))));
  }
  return out;
}

function pathLength(points) {
  let total = 0;
  for (let index = 1; index < points.length; index++) total += len3(sub3(points[index], points[index - 1]));
  return total;
}

function cut(points, from, to) {
  const out = [];
  let walked = 0;
  for (let index = 1; index < points.length; index++) {
    const a = points[index - 1];
    const b = points[index];
    const length = len3(sub3(b, a));
    const start = walked;
    const end = walked + length;
    if (end >= from && start <= to) {
      const t0 = Math.max(0, (from - start) / (length || 1));
      const t1 = Math.min(1, (to - start) / (length || 1));
      if (!out.length) out.push(lerp3(a, b, t0));
      out.push(lerp3(a, b, t1));
    }
    walked = end;
  }
  return out;
}

const pointAlong = (points, at) => {
  const piece = cut(points, at, at + 0.01);
  return piece[0] ?? points[points.length - 1];
};

function tangentAlong(points, at) {
  const total = pathLength(points);
  const a = pointAlong(points, Math.max(0, at - 0.6));
  const b = pointAlong(points, Math.min(total, at + 0.6));
  return unit3(sub3(b, a));
}

function spiral(F, s, r0, r1, a0, a1, steps = 28) {
  const out = [];
  for (let index = 0; index <= steps; index++) {
    const t = index / steps;
    out.push(pointOf(F, s, r0 + (r1 - r0) * t, a0 + (a1 - a0) * t));
  }
  return out;
}

function arcPoints(F, s, r, a0, a1, steps = 24) {
  return Array.from({ length: steps + 1 }, (_, index) => pointOf(F, s, r, a0 + ((a1 - a0) * index) / steps));
}

// ---------- fluido: color de cada trozo de tubo y partículas que lo recorren ----------
const SP = 8.5;
const rutas = {};

  const cum = [0];
  for (let i = 1; i < r.line.length; i++) cum.push(cum[i - 1] + Math.hypot(r.line[i][0] - r.line[i - 1][0], r.line[i][1] - r.line[i - 1][1], r.line[i][2] - r.line[i - 1][2]));
  const grupos = r.chunks.map((_, i) => svg.querySelector(`.it[data-ruta="${id}"][data-trozo="${i}"]`));
  const n = Math.max(1, Math.round(r.total / SP));
  rutas[id] = { ...r, cum, grupos, capas: grupos.map((g) => g.querySelector(".bc-p")), pools: grupos.map(() => []), n, sp: r.total / n, seed: id.length * 7.31 };
}
const puntoEn = (r, s) => {
  let lo = 0, hi = r.cum.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (r.cum[mid] <= s) lo = mid;
    else hi = mid;
  }
  const a = r.line[lo], b = r.line[hi];
  const t = (s - r.cum[lo]) / (r.cum[hi] - r.cum[lo] || 1);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
};
const estadoEn = (zonas, s) => {
  const z = zonas.find(([a, b]) => s >= a - 1e-6 && s <= b + 1e-6) ?? zonas[zonas.length - 1];
  const t = z[1] > z[0] ? (s - z[0]) / (z[1] - z[0]) : 0;
  return { lado: z[2], q: z[3] + (z[4] - z[3]) * Math.max(0, Math.min(1, t)) };
};

function particulas() {
  for (const [id, r] of Object.entries(rutas)) {
    const zonas = D.ZONAS[modo][id];
    const o = D.SENTIDO[modo][id] * flujo;
    const off = ((o % r.sp) + r.sp) % r.sp;
    const shift = Math.floor(o / r.sp);
    r.chunks.forEach(([a, b], c) => {
      const pool = r.pools[c];
      const j0 = Math.ceil((a - off) / r.sp), j1 = Math.floor((b - off) / r.sp);
      let used = 0;
      for (let j = j0; j <= j1; j++) {
        const s = j * r.sp + off;
        if (s < 0 || s > r.total) continue;
        const ident = (((j - shift) % r.n) + r.n) % r.n;
        const e = estadoEn(zonas, s);
        const gota = hash(ident + r.seed) >= e.q;
        let el = pool[used];
        if (!el) {
          el = document.createElementNS(NS, "circle");
          r.capas[c].append(el);
          pool.push(el);
        }
        const [x, y] = iso(puntoEn(r, s), P);
        el.setAttribute("cx", f1(x));
        el.setAttribute("cy", f1(y));
        const cls = gota ? "bc-gota" : "bc-burbuja";
        if (el.getAttribute("class") !== cls) {
          el.setAttribute("class", cls);
          el.setAttribute("r", gota ? "1.55" : "1.3");
        }
        if (el.style.display) el.style.display = "";
        used++;
      }
      for (let i = used; i < pool.length; i++) if (!pool[i].style.display) pool[i].style.display = "none";
    });
  }
}
function colorear() {
  for (const [id, r] of Object.entries(rutas)) {

      const [fill, pc] = D.COLORES[modo][id][c];
      g.style.setProperty("--f", fill);

}

// ---------- compresor, ventiladores y corredera ----------
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mezcla = (a, b, t) => `rgb(${hexRGB(a).map((c, i) => Math.round(c + (hexRGB(b)[i] - c) * t)).join(",")})`;
const colorCil = (c) => mezcla(M.COLOR[1].fill, M.COLOR[2].fill, c);
const cache = new Map();
let dibujado = null;
function moviles() {
  const key = Math.round(theta * 4) / 4;
  if (key === dibujado) return;
  dibujado = key;
  const ps = GEO.poseCompresor(theta);
  const svgs = {
    "comp.rotor": () => Z.rotorSvg(ps),
    "comp.exc": () => Z.excSvg(ps),
    "comp.biela": () => Z.bielaSvg(ps),
    "comp.piston": () => Z.pistonSvg(ps),
    "comp.lamina.asp": () => Z.laminaSvg("asp", ps.asp),
    "comp.lamina.desc": () => Z.laminaSvg("desc", ps.desc),
    "ui.vent": () => Z.ventUISvg(theta * 3 * D2R),
    "ue.vent": () => Z.ventUESvg(theta * 2 * D2R),
  };
  for (const [name, fn] of Object.entries(svgs)) {
    const node = re.get(name);
    if (!node) continue;
    const html = fn();
    if (cache.get(name) !== html) {
      node.innerHTML = html;
      cache.set(name, html);
    }
  }
  gasCil.innerHTML = Z.gasCilindro(ps, colorCil);
}
function ponerCorredera() {
  corr.setAttribute("transform", translateAlong(P, [0, -(corrU - D.CORREDERA.verano), 0]));
}

// ---------- lectura, p-V y marco del tramo ----------
const lineas = [...readout.querySelectorAll(".bc-l")];
let dicho = "";
function say() {
  const t = tramoActual();
  const L = LE.lineasLectura(M, modo, t, { pausa: !playing && !still.matches });
  const key = `${modo}|${t}|${L.lineas[1]}`;
  if (key !== dicho) {
    dicho = key;
    L.lineas.forEach((texto, i) => {
      const html = LE.conSub(texto);
      if (lineas[i].innerHTML !== html) lineas[i].innerHTML = html;
    });
    lineas[0].dataset.tramo = String(t);
    for (const m of marcos) m.toggleAttribute("data-on", m.dataset.marco === String(t));
    pvCurvas.forEach((c, i) => c.toggleAttribute("data-on", i === t));
    stage.dataset.tramo = String(t);
  }
  const [V, p] = M.puntoPV(t, avance());
  pvPunto.setAttribute("cx", f1(34 + V * (D.PV.W - 50)));
  pvPunto.setAttribute("cy", f1(D.PV.H - 26 - p * (D.PV.H - 44)));
}

function draw() {
  moviles();
  particulas();
  ponerCorredera();
  say();
  if (todos) ponerGuias();
  if (hover || pinned) mostrarUna();
  ponerPausa();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (playing) {
    fase += dt / ritmo("tramo");
    theta = (theta + dt * ritmo("rpm") * 6) % 360;
    flujo += dt * ritmo("flujo");
  }
  // la corredera se desliza hasta la posición de la estación (en un segundo, más o menos)
  const meta = D.CORREDERA[modo];
  if (corrU !== meta) {
    const paso = still.matches ? Infinity : dt * 16;
    corrU = Math.abs(meta - corrU) <= paso ? meta : corrU + Math.sign(meta - corrU) * paso;
  }
  draw();
  frame = visible && (playing || corrU !== meta) ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const holdThenResume = () => {
  clearTimeout(resumeTimer);
  if (userPaused || still.matches) return;
  resumeTimer = setTimeout(() => {
    playing = true;
    run();
  }, 6000);
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
const quieta = () => stage.toggleAttribute("data-quieta", still.matches || !playing);
still.addEventListener?.("change", () => {
  if (still.matches) playing = false;
  quieta();
  draw();
});

// ---------- nombres de las piezas ----------
let todos = false;
let pinned = null;
let hover = null;
let anc = {};
const el = (tag, attrs, text) => {
  const node = document.createElementNS(NS, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text) node.textContent = text;
  return node;
};
const ctx = () => ({ modo, theta, corrU, Z, GEO, G, iso: (p) => iso(p, P) });
const guias = NM.ETIQUETAS.map((e) => {
  const g = el("g", { class: "bc-etq", "data-pieza-nombre": e.id });
  const [gx, gy] = e.guia;
  const izq = e.lado === "izq";
  const linea = el("path", { class: "bc-guia", d: "" });
  const fin = el("circle", { class: "bc-npunto", r: "1.9", cx: gx, cy: gy });
  const ini = el("circle", { class: "bc-npunto", r: "1.5", cx: gx, cy: gy });
  const texto = el("text", { y: gy, "text-anchor": izq ? "end" : "start" });
  // en dos líneas, centradas en la guía
  e.lineas.forEach((l, i) => texto.append(el("tspan", { x: izq ? gx - 5 : gx + 5, dy: i ? "1.1em" : e.lineas.length > 1 ? "-0.2em" : "0.35em" }, l)));
  g.append(linea, ini, fin, texto);
  capaTodos.append(g);
  return { e, g, linea, fin };
});
function ponerGuias() {
  anc = NM.anclas(ctx());
  for (const { e, g, linea, fin } of guias) {
    const punto = anc[e.id];
    g.style.display = punto ? "" : "none";
    if (!punto) continue;
    const [ax, ay] = iso(punto, P);
    linea.setAttribute("d", `M${e.guia[0]} ${e.guia[1]}L${f1(ax)} ${f1(ay)}`);
    fin.setAttribute("cx", f1(ax));
    fin.setAttribute("cy", f1(ay));
  }
}
function gruposDe(id) {
  return items.filter((g) => (g.dataset.pieza ?? NM.piezaDe(g.dataset.name)) === id);
}
let resaltadas = [];
let etiquetaDe = null;
function mostrarUna() {
  const sel = hover ?? pinned;
  const key = sel ? `${sel.id}|${sel.at?.join(",")}` : null;
  if (key !== etiquetaDe) {
    etiquetaDe = key;
    for (const g of resaltadas) g.classList.remove("bc-sel");
    resaltadas = sel ? gruposDe(sel.id) : [];
    for (const g of resaltadas) g.classList.add("bc-sel");
    stage.dataset.pieza = sel ? sel.id : "";
  }
  capaUna.replaceChildren();
  if (!sel) return;
  anc = NM.anclas(ctx());
  const a = anc[sel.id] ? iso(anc[sel.id], P) : sel.at;
  if (!a) return;
  const vb = svg.viewBox.baseVal;
  const izq = a[0] > vb.width * 0.62;
  const g = el("g", { class: "bc-una" });
  const texto = el("text", { x: 0, y: 0, "text-anchor": izq ? "end" : "start" }, NM.NOMBRE[sel.id]);
  const caja = el("rect", { rx: 3 });
  g.append(caja, texto, el("circle", { class: "bc-npunto", r: "2.2", cx: f1(a[0]), cy: f1(a[1]) }));
  capaUna.append(g);
  const box = texto.getBBox();
  let x = izq ? a[0] - 9 : a[0] + 9;
  let y = a[1] - 11;
  const w = box.width + 12, h = box.height + 7;
  if (izq && x - w < vb.x + 4) x = vb.x + 4 + w;
  if (!izq && x + w > vb.x + vb.width - 4) x = vb.x + vb.width - 4 - w;
  y = Math.max(vb.y + h / 2 + 2, y);
  texto.setAttribute("x", f1(izq ? x - 6 : x + 6));
  texto.setAttribute("y", f1(y + box.height * 0.32));
  caja.setAttribute("x", f1(izq ? x - w : x));
  caja.setAttribute("y", f1(y - h / 2));
  caja.setAttribute("width", f1(w));
  caja.setAttribute("height", f1(h));
}
function verTodos(on) {
  todos = on;
  capaTodos.style.display = on ? "" : "none";
  bNombres.setAttribute("aria-pressed", String(on));
  if (on) ponerGuias();
  if (status) status.textContent = on ? "Nombres de las piezas a la vista" : "Nombres ocultos";
}
const enVB = (event) => {
  const m = svg.getScreenCTM();
  if (!m) return [0, 0];
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  return [p.x, p.y];
};
function piezaEn(target) {
  const g = target.closest?.(".it");
  if (!g || !svg.contains(g)) return null;
  return g.dataset.pieza ?? NM.piezaDe(g.dataset.name);
}
// un toque corto nombra la pieza; con ratón, basta con pasar por encima
let down = null;
stage.addEventListener("pointerdown", (event) => {
  down = { x: event.clientX, y: event.clientY, id: piezaEn(event.target), at: enVB(event), moved: false };
});
stage.addEventListener("pointermove", (event) => {
  if (down) {
    if (Math.hypot(event.clientX - down.x, event.clientY - down.y) > 8) down.moved = true;
    return;
  }
  if (event.pointerType !== "mouse") return;
  const id = piezaEn(event.target);
  const next = id ? { id, at: enVB(event) } : null;
  if ((next?.id ?? null) !== (hover?.id ?? null)) {
    hover = next;
    mostrarUna();
  }
});
stage.addEventListener("pointerleave", (event) => {
  if (event.pointerType === "mouse" && hover) {
    hover = null;
    mostrarUna();
  }
});
const soltar = (event) => {
  if (event.type === "pointerup" && down && !down.moved) {
    pinned = down.id ? { id: down.id, at: down.at } : null;
    if (event.pointerType !== "mouse") hover = null;
    mostrarUna();
    if (status) status.textContent = pinned ? NM.NOMBRE[pinned.id] : "";
  }
  down = null;
};
stage.addEventListener("pointerup", soltar);
stage.addEventListener("pointercancel", soltar);
stage.addEventListener("contextmenu", (event) => event.preventDefault());
document.addEventListener("pointerdown", (event) => {
  if (pinned && !stage.contains(event.target) && !event.target.closest?.(".bc-boton")) {
    pinned = null;
    mostrarUna();
  }
});

// ---------- mandos: cada botón hace lo mismo que su tecla ----------
const mando = (name) => plate.querySelector(`[data-mando="${name}"]`);
const bPausa = mando("pausa"), bAnt = mando("anterior"), bSig = mando("siguiente"), bLento = mando("lento"), bEst = mando("estacion"), bNombres = mando("nombres"), bMax = mando("maximizar"), bSalir = mando("salir");
function alternarPausa() {
  if (still.matches) {
    if (status) status.textContent = "Movimiento reducido: la figura está quieta; cambia de tramo con ◀ y ▶ y de estación con Verano/Invierno";
    return;
  }
  playing = !playing;
  userPaused = !playing;
  clearTimeout(resumeTimer);
  quieta();
  if (status) status.textContent = playing ? "En marcha" : "En pausa";
  draw();
  run();
}
function pasoTramo(d) {
  // salta a la mitad del tramo anterior o siguiente y se queda ahí un rato
  if (!still.matches && !userPaused) playing = false;
  fase = Math.floor(fase) + d + 0.5;
  if (fase < 0) fase += 4000;
  quieta();
  draw();
  if (status) status.textContent = `Tramo ${M.TRAMOS[tramoActual()].de}→${M.TRAMOS[tramoActual()].a}: ${M.TRAMOS[tramoActual()].nombre}`;
  holdThenResume();
  run();
}
function alternarLento() {
  slow = !slow;
  bLento.setAttribute("aria-pressed", String(slow));
  if (status) status.textContent = slow ? "Lento" : "Velocidad normal";
  run();
}
function cambiarEstacion() {
  modo = modo === "verano" ? "invierno" : "verano";
  stage.dataset.modo = modo;
  colorear();
  const m = M.MODOS[modo];
  bEst.dataset.estacion = modo;
  bEst.querySelector("[data-texto]").textContent = m.estacion;
  bEst.setAttribute("aria-label", `Estación: ${m.estacion.toLowerCase()}. Pulsa para pasar a ${modo === "verano" ? "invierno" : "verano"}`);
  if (status) status.textContent = `${m.estacion}: ${m.maquina}. La batería interior hace de ${m.bateriaInterior}.`;
  dicho = "";
  if (still.matches) corrU = D.CORREDERA[modo];
  draw();
  last = 0;
  if (!frame && visible) frame = requestAnimationFrame(tick);
}
let textoPausa = "";
function ponerPausa() {
  const next = playing ? "Pausa" : "Reanudar";
  if (next === textoPausa) return;
  textoPausa = next;
  bPausa.querySelector("[data-texto]").textContent = next;
  bPausa.setAttribute("aria-label", next);
}

// ---------- Maximizar: pantalla completa (o la tarjeta a toda la ventana) ----------
let maxi = false;
let fsPedida = false;
let antes = null;
const fsEl = () => document.fullscreenElement ?? document.webkitFullscreenElement ?? null;
function ponerMax(on) {
  if (on === maxi) return;
  maxi = on;
  plate.classList.toggle("bc-max", on);
  document.documentElement.classList.toggle("bc-max-abierto", on);
  bSalir.hidden = !on;
  bMax.setAttribute("aria-pressed", String(on));
  if (status) status.textContent = on ? "Pantalla completa: pulsa Salir o Esc para volver" : "Tamaño normal";
  etiquetaDe = null;
  if (hover || pinned) mostrarUna();
}
function maximizar() {
  if (maxi) return;
  antes = { x: scrollX, y: scrollY, foco: document.activeElement };
  ponerMax(true);
  bSalir.focus({ preventScroll: true });
  const pedir = plate.requestFullscreen ?? plate.webkitRequestFullscreen;
  if (!pedir) return;
  try {
    fsPedida = true;
    const r = pedir.call(plate);
    if (r && r.catch) r.catch(() => (fsPedida = false));
  } catch {
    fsPedida = false;
  }
}
function salir() {
  if (!maxi) return;
  fsPedida = false;
  if (fsEl()) {
    const fuera = document.exitFullscreen ?? document.webkitExitFullscreen;
    try {
      const r = fuera?.call(document);
      if (r && r.catch) r.catch(() => {});
    } catch {}
  }
  ponerMax(false);
  if (antes) {
    const { x, y, foco } = antes;
    const volver = () => scrollTo(x, y);
    volver();
    requestAnimationFrame(volver);
    setTimeout(volver, 300);
    (foco && document.contains(foco) && foco !== bSalir && foco !== document.body ? foco : bMax).focus({ preventScroll: true });
    antes = null;
  }
}
const alCambiar = () => {
  if (fsEl() === plate) return;
  if (maxi && fsPedida) salir();
};
document.addEventListener("fullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenchange", alCambiar);
document.addEventListener("webkitfullscreenerror", () => (fsPedida = false));

bPausa.addEventListener("click", alternarPausa);
bAnt.addEventListener("click", () => pasoTramo(-1));
bSig.addEventListener("click", () => pasoTramo(1));
bLento.addEventListener("click", alternarLento);
bEst.addEventListener("click", cambiarEstacion);
bNombres.addEventListener("click", () => verTodos(!todos));
bMax.addEventListener("click", maximizar);
bSalir.addEventListener("click", salir);

const libre = (event) => !event.ctrlKey && !event.metaKey && !event.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName ?? "");
document.addEventListener("keydown", (event) => {
  if (!libre(event)) return;
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  const enBoton = event.target?.closest?.(".bc-boton");
  if (key === " " || event.code === "Space") {
    if (enBoton) return; // Espacio sobre un botón lo pulsa
    event.preventDefault();
    alternarPausa();
  } else if (key === "ArrowRight" || key === "ArrowLeft") {
    event.preventDefault();
    pasoTramo(key === "ArrowRight" ? 1 : -1);
  } else if (key === "s") {
    event.preventDefault();
    alternarLento();
  } else if (key === "e") {
    event.preventDefault();
    cambiarEstacion();
  } else if (key === "n") {
    event.preventDefault();
    verTodos(!todos);
  } else if (key === "m") {
    event.preventDefault();
    if (maxi) salir();
    else maximizar();
  } else if (key === "Escape") {
    if (pinned || hover) {
      pinned = hover = null;
      mostrarUna();
    }
    if (maxi) salir();
  }
});

// ---------- ganchos para las comprobaciones (verifica.mjs y capturas) ----------
stage.__fijar = ({ modo: m, tramo, f = 0.5, theta: th } = {}) => {
  playing = false;
  userPaused = true;
  clearTimeout(resumeTimer);
  // sin transiciones de color: el estado fijado se ve ya terminado
  stage.classList.add("bc-ya");
  if (m && m !== modo) cambiarEstacion();
  corrU = D.CORREDERA[modo];
  if (tramo !== undefined) fase = tramo + f;
  if (th !== undefined) theta = th;
  quieta();
  dicho = "";
  draw();
  void svg.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("bc-ya")));
  return readout.textContent;
};
stage.__girar = () => {
  if (still.matches) return;
  playing = true;
  userPaused = false;
  quieta();
  run();
};
stage.__estado = () => ({ playing, userPaused, slow, todos, max: maxi, fs: Boolean(fsEl()), modo, tramo: tramoActual(), f: Math.round(avance() * 1000) / 1000, theta: Math.round(theta * 1000) / 1000, corredera: corrU });
stage.__anclas = () => Object.fromEntries(Object.entries(NM.anclas(ctx())).filter(([, p]) => p).map(([id, p]) => [id, iso(p, P).map(f1)]));
const queHay = (p) => {
  const at = iso(p, P);
  const c = new DOMPoint(at[0], at[1]).matrixTransform(svg.getScreenCTM());
  const hit = document.elementFromPoint(c.x, c.y);
  return hit ? piezaEn(hit) : null;
};
stage.__visibles = () => Object.fromEntries(Object.entries(NM.anclas(ctx())).filter(([id, p]) => p && NM.NOMBRE[id]).map(([id, p]) => [id, queHay(p)]));
// lo que se ve del fluido junto a cada punto 1-4 del modo actual: color del tubo y partículas de su trozo
stage.__fluido = () => {
  const out = {};
  for (const n of [1, 2, 3, 4]) {
    const [id, s] = D.PUNTOS[modo][n];
    const r = rutas[id];
    const c = r.chunks.findIndex(([a, b]) => s >= a && s <= b);
    const g = r.grupos[c];
    const body = g.querySelector(".tb-body");
    // partículas de todo el tramo de tubo que está en el mismo estado que el punto (zona uniforme)
    const zonas = D.ZONAS[modo][id];
    const z = zonas.find(([z0, z1]) => s >= z0 && s <= z1);
    const mismos = r.chunks.map(([a, b], i) => [i, (a + b) / 2]).filter(([, mid]) => mid >= z[0] && mid <= z[1]).map(([i]) => i);
    const parts = mismos.flatMap((i) => [...r.capas[i].querySelectorAll("circle")]).filter((p) => p.style.display !== "none");
    const marca = svg.querySelector(`.bc-punto[data-punto="${n}"][data-modo-solo="${modo}"]`);
    const mc = marca.querySelector("circle");
    const [x, y] = iso(puntoEn(r, s), P);
    out[n] = { ruta: id, s, trozo: c, color: getComputedStyle(body).fill, gotas: parts.filter((p) => p.getAttribute("class") === "bc-gota").length, burbujas: parts.filter((p) => p.getAttribute("class") === "bc-burbuja").length, marca: [Number(mc.getAttribute("cx")), Number(mc.getAttribute("cy"))], tubo: [f1(x), f1(y)], visible: getComputedStyle(marca).display !== "none" };
  }
  return out;
};
stage.__flechas = () => [...svg.querySelectorAll(".bc-flecha")].filter((g) => getComputedStyle(g).display !== "none").map((g) => {
  const pts = g.querySelector("path").getAttribute("d").replace(/[MZ]/g, " ").trim().split(/L|\s+/).filter(Boolean).map(Number);
  const xy = [];
  for (let i = 0; i + 1 < pts.length; i += 2) xy.push([pts[i], pts[i + 1]]);
  const [a, b] = [xy[0], xy[xy.length - 1]];
  return { q: g.dataset.energia, valor: Number(g.dataset.valor), ancho: Number(g.dataset.ancho), medido: Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) * 100) / 100, texto: g.querySelector("text").textContent };
});
stage.__rotulos = () => Object.fromEntries([...svg.querySelectorAll(".bc-rotulo")].filter((g) => getComputedStyle(g).display !== "none").map((g) => [g.dataset.rotulo, g.querySelector("text").textContent.replace(/\s+/g, " ").trim()]));
stage.__corredera = () => ({ u: corrU, transform: corr.getAttribute("transform") });
stage.__pv = () => {
  const cx = Number(pvPunto.getAttribute("cx")), cy = Number(pvPunto.getAttribute("cy"));
  const dist = pvCurvas.map((c) => {
    const L = c.getTotalLength();
    let best = Infinity;
    for (let i = 0; i <= 60; i++) {
      const q = c.getPointAtLength((L * i) / 60);
      best = Math.min(best, Math.hypot(q.x - cx, q.y - cy));
    }
    return Math.round(best * 100) / 100;
  });
  return { cx, cy, dist, on: pvCurvas.findIndex((c) => c.hasAttribute("data-on")) };
};

quieta();
colorear();
draw();
</script></body></html>
